
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 4</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">    
                <div class="card cardragud shadow-sm">
                    <div class="card-body">
                    <h6><span id="badge" class="badge text-bg-primary">Level 4</span></h6>
                    <h1 class="h4 fw-bold mt-2">Web Dev Mini-Quest</h1>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Maxime nobis, soluta eaque nam nesciunt optio, pariatur modi facere</p>
                    <label for="Name" class="form-label">Name</label>
              <input id="Name" type="text" class="form-control" placeholder="Type your name...">
              <p id="result" class="mt-3 mb-0"></p>
              <button id="submit" class="btn btn-primary w-100 mt-2"> Submit Name </button>
              <hr />
                    <div class="d-flex gap-2">
                        <button class="btn btn-secondary w-50 btn-quest" onclick="window.location.href = 'level3.html'">Back</button>
                        <button class="btn btn-primary w-50 btn-quest" onclick="window.location.href = 'level5.html'">Next Level</button>
                        </div>
                    </div>                   
                </div>
            </div>
        </div>
    </div>
    <script>
        const Name = document.getElementById("Name");
      const subBtn = document.getElementById("subBtn");
      const result = document.getElementById("result");

      submit.addEventListener("click", function () {
        const name = Name.value.trim();

        if (name === "") {
          result.className = "text-danger fw-semibold";
          result.textContent = "Name is required!";
        } else {
          result.className = "text-success fw-semibold";
          result.textContent = "Welcome, " + name + "! ✅";
        }
      });

    </script>
  </body>
</html>
