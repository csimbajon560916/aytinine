
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Level 3</title>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>

  <body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">    
                <div class="card cardragud shadow-sm">
                    <div class="card-body">
                    <h6><span id="badge" class="badge text-bg-primary">Level 1</span></h6>
                    <h1 class="h4 fw-bold mt-2">Web Dev Mini-Quest</h1>
                    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Maxime nobis, soluta eaque nam nesciunt optio, pariatur modi facere</p>
                    <div class="d-flex gap-2">
                        <button class="btn btn-secondary w-50 btn-quest" onclick="window.location.href = 'level2.html'">Back</button>
                        <button class="btn btn-primary w-50 btn-quest" onclick="window.location.href = 'level4.html'">Next Level</button>
                        </div>
                    </div>
                    <button id="levelup" class="btn btn-success w-100 mb-3"> Level Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
      let Level = 1;

      const badge = document.getElementById("badge");
      const levelup = document.getElementById("levelup");

      levelup.addEventListener("click", function () {
        if (Level < 6) Level++;

        badge.innerHTML =
          ' Level ' + Level;
      });
    </script>
  </body>
</html>
